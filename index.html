<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922; --orange: #db6d28;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; background: var(--bg); color: var(--text); font-size: 13px; }

/* ── Top bar ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: 1.5px; color: var(--accent); }
.topbar .meta { font-size: 11px; color: var(--text2); }
.status-pill {
  display: inline-block; padding: 4px 14px; border-radius: 12px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.status-running { background: rgba(63,185,80,0.15); color: var(--green); }
.status-paused { background: rgba(210,153,34,0.15); color: var(--yellow); }
.status-stopped { background: rgba(248,81,73,0.15); color: var(--red); }
.status-offline { background: rgba(139,148,158,0.15); color: var(--text2); }

/* ── Metrics row ── */
.metrics {
  display: flex; border-bottom: 1px solid var(--border);
}
.metric {
  flex: 1; padding: 16px 20px; background: var(--surface);
  border-right: 1px solid var(--border);
}
.metric:last-child { border-right: none; }
.metric label { display: block; font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.metric .val { font-size: 22px; font-weight: 700; }
.green { color: var(--green); }
.red { color: var(--red); }
.yellow { color: var(--yellow); }

/* ── Grid layout ── */
.grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--border);
}
.grid > section { background: var(--surface); padding: 16px 20px; }
.grid.three { grid-template-columns: 1fr 1fr 1fr; }

section h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ── Tables ── */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--text2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 8px 8px 0; }
td { padding: 5px 8px 5px 0; border-top: 1px solid rgba(48,54,61,0.5); white-space: nowrap; }
tr:hover td { background: rgba(88,166,255,0.04); }

/* ── Signal bar ── */
.signal-bar {
  display: inline-block; height: 8px; border-radius: 4px; min-width: 2px; vertical-align: middle;
}
.signal-pos { background: var(--green); }
.signal-neg { background: var(--red); }

/* ── Log pane ── */
.log-pane {
  background: var(--bg); padding: 12px 16px;
  max-height: 300px; overflow-y: auto;
  font-size: 11px; line-height: 1.6;
  border-top: 1px solid var(--border);
}
.log-pane .line { color: var(--text2); }
.log-pane .line.warn { color: var(--yellow); }
.log-pane .line.err { color: var(--red); }
.log-pane .line.buy { color: var(--green); }
.log-pane .line.sell { color: var(--orange); }

/* ── Memory ── */
.memory-pane {
  background: var(--bg); padding: 12px 16px; font-size: 12px;
  line-height: 1.7; color: var(--text2); white-space: pre-wrap; max-height: 400px; overflow-y: auto;
}
.memory-pane h1, .memory-pane h2, .memory-pane h3 { color: var(--accent); font-size: 13px; margin: 8px 0 4px; }

/* ── Full width ── */
.full { grid-column: 1 / -1; }

/* ── Equity chart ── */
.chart-wrap {
  background: var(--surface); padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.chart-wrap h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.chart-svg { width: 100%; }
.chart-grid { stroke: var(--border); stroke-width: 0.5; }
.chart-axis-label { fill: var(--text2); font-size: 10px; font-family: inherit; }
.chart-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart-area { opacity: 0.08; }
.chart-dot { r: 3; opacity: 0; transition: opacity 0.15s; }
.chart-dot:hover { opacity: 1; }
.chart-baseline { stroke: var(--text2); stroke-width: 0.5; stroke-dasharray: 4 3; }
.chart-tooltip {
  position: absolute; background: var(--surface); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 6px; font-size: 11px; pointer-events: none;
  color: var(--text); display: none; z-index: 10; white-space: nowrap;
}

/* ── Footer ── */
.footer {
  padding: 8px 24px; font-size: 10px; color: var(--text2);
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; justify-content: space-between;
}
</style>
</head>

  .sort((a, b) => Math.abs(b.signal || 0) - Math.abs(a.signal || 0));
const activeSignals = dedupedPreds.filter(p => Math.abs(p.signal || 0) > 0.001);
const zeroCount = dedupedPreds.length - activeSignals.length;

html += '<h2>Latest Signals (' + activeSignals.length + ' active, ' + zeroCount + ' flat)</h2>';
if (dedupedPreds.length === 0) {
  html += '<div style="color:var(--text2)">No signals yet</div>';
} else {
  html += '<table><tr><th>Symbol</th><th>Signal</th><th></th><th>Reason</th><th>Time</th></tr>';
  for (const p of dedupedPreds) {
    const sig = p.signal || 0;
    const reason = (p.meta && p.meta.reason) ? p.meta.reason : '';
    const dimStyle = Math.abs(sig) < 0.001 ? ' style="opacity:0.35"' : '';
    html += '<tr' + dimStyle + '>';
    html += '<td style="font-weight:600">' + (p.symbol || '?') + '</td>';
    html += '<td class="' + clr(sig) + '">' + (sig >= 0 ? '+' : '') + sig.toFixed(3) + '</td>';
    html += '<td>' + signalBar(sig) + '</td>';
    html += '<td style="color:var(--text2);font-size:10px">' + reason + '</td>';
    html += '<td style="color:var(--text2)">' + ago(p.timestamp) + '</td>';
    html += '</tr>';
  }
  html += '</table>';
}
html += '</section>';

// ── Trades ──
html += '<section>';
html += '<h2>Recent Trades (' + tradeCount + ' total)</h2>';
if (trades.length === 0) {
  html += '<div style="color:var(--text2)">No trades yet</div>';
} else {
  html += '<table><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>P&L</th><th>Reason</th></tr>';
  for (const t of trades.slice(-15).reverse()) {
    const side = (t.side || t.action || '').toUpperCase();
    const sideClr = side === 'BUY' ? 'green' : 'red';
    const tPnl = t.pnl != null ? t.pnl : (t.realized_pnl != null ? t.realized_pnl : null);
    const hasPnl = tPnl != null;
    const shares = t.shares || t.qty || t.quantity || '—';
    const reason = t.reason || '';
    html += '<tr>';
    html += '<td style="color:var(--text2)">' + ago(t.timestamp || t.time) + '</td>';
    html += '<td style="font-weight:600">' + (t.symbol || '?') + '</td>';
    html += '<td class="' + sideClr + '">' + side + '</td>';
    html += '<td>' + shares + '</td>';
    html += '<td>' + fmtUsd(t.price || 0) + '</td>';
    html += '<td class="' + (hasPnl ? clr(tPnl) : '') + '">' + (hasPnl ? fmtUsd(tPnl) : '—') + '</td>';
    html += '<td style="color:var(--text2);font-size:10px">' + reason + '</td>';
    html += '</tr>';
  }
  html += '</table>';
}
html += '</section>';

// ── Universe ──
html += '<section>';
html += '<h2>Universe (' + activeSymbols.length + ' active)</h2>';
html += '<table><tr><th>Symbol</th><th>Max Alloc</th><th>Note</th></tr>';
for (const inst of (universe.active || [])) {
  const sym = typeof inst === 'string' ? inst : inst.symbol;
  const alloc = typeof inst === 'object' ? (inst.max_alloc_pct || '—') : '—';
  const note = typeof inst === 'object' ? (inst.note || '') : '';
  html += '<tr>';
  html += '<td style="font-weight:600">' + sym + '</td>';
  html += '<td>' + alloc + '%</td>';
  html += '<td style="color:var(--text2);white-space:normal;max-width:300px">' + note + '</td>';
  html += '</tr>';
}
html += '</table>';
html += '</section>';

// ── Regime Status ──
html += '<section>';
html += '<h2>Regime Status</h2>';
html += '<div style="padding:12px;background:rgba(' + (regimeColor === '#f44336' ? '244,67,54' : regimeColor === '#ff9800' ? '255,152,0' : regimeColor === '#2196F3' ? '33,150,243' : '76,175,80') + ',0.1);border-left:4px solid ' + regimeColor + ';border-radius:4px">';
html += '<div style="font-weight:600;color:' + regimeColor + ';margin-bottom:4px">' + regime + '</div>';
html += '<div style="color:var(--text2);font-size:11px">VIX: ' + fmt(vix, 1) + '</div>';
html += '</div>';
html += '</section>';

// ── Correlation Alert ──
html += '<section>';
html += '<h2>Correlation Alert</h2>';
if (!hasCorr) {
  html += '<div style="color:var(--text2)">No correlation data yet</div>';
} else {
  html += '<table><tr><th>Symbol</th><th>Correlation</th><th>Alert</th></tr>';
  for (const sym in correlation) {
    const corr = correlation[sym];
    const corrVal = corr.value != null ? corr.value : 0;
    const alert = corr.alert || 'normal';
    const alertColor = alert === 'high' ? 'var(--red)' : alert === 'moderate' ? 'var(--yellow)' : 'var(--green)';
    html += '<tr>';
    html += '<td style="font-weight:600">' + sym + '</td>';
    html += '<td class="' + (corrVal >= 0.7 ? 'red' : 'green') + '">' + (corrVal >= 0 ? '+' : '') + fmt(corrVal, 2) + '</td>';
    html += '<td style="color:' + alertColor + ';font-weight:600">' + alert.toUpperCase() + '</td>';
    html += '</tr>';
  }
  html += '</table>';
}
html += '</section>';

// ── Brain / Config ──
html += '<section>';
html += '<h2>Configuration</h2>';
html += '<table>';
html += '<tr><td style="color:var(--text2)">Generation</td><td style="font-weight:600">' + (brain.generation || 0) + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Thesis</td><td style="white-space:normal">' + (brain.thesis || '—') + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Last Changed</td><td>' + (brain.last_changed || '—') + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Scan Interval</td><td>' + (cadence.scan_interval_seconds || '—') + 's</td></tr>';
html += '<tr><td style="color:var(--text2)">Data Interval</td><td>' + (cadence.data_interval || '—') + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Data Period</td><td>' + (cadence.data_period || '—') + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Hold Bars</td><td>' + (cadence.hold_bars || '—') + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Market Hours Only</td><td>' + (cadence.market_hours_only ? 'Yes' : 'No') + '</td></tr>';
html += '<tr><td style="color:var(--text2)">Reflect Every</td><td>' + (cadence.reflect_every_n_cycles || '—') + ' cycles</td></tr>';
html += '</table>';
html += '</section>';

// ── Reflections ──
html += '<section class="full">';
html += '<h2>Reflection History</h2>';
const refs = S.reflections || [];
if (refs.length === 0) {
  html += '<div style="color:var(--text2)">No reflections yet</div>';
} else {
  html += '<table><tr><th>Time</th><th>Gen</th><th>Thesis</th><th>Confidence</th><th>Strategy</th><th>Cadence</th><th>Universe</th></tr>';
  for (const r of refs.slice().reverse()) {
    html += '<tr>';
    html += '<td style="color:var(--text2)">' + ago(r.timestamp) + '</td>';
    html += '<td>' + (r.old_generation || '?') + ' → ' + (r.new_generation || '?') + '</td>';
    html += '<td style="white-space:normal;max-width:300px">' + (r.thesis || '') + '</td>';
    html += '<td>' + (r.confidence != null ? (r.confidence * 100).toFixed(0) + '%' : '—') + '</td>';
    html += '<td class="' + (r.strategy_ok ? 'green' : 'red') + '">' + (r.strategy_ok ? 'OK' : 'FAIL') + '</td>';
    html += '<td class="' + (r.cadence_ok ? 'green' : 'red') + '">' + (r.cadence_ok ? 'OK' : 'FAIL') + '</td>';
    html += '<td class="' + (r.universe_ok ? 'green' : 'red') + '">' + (r.universe_ok ? 'OK' : 'FAIL') + '</td>';
    html += '</tr>';
  }
  html += '</table>';
}
html += '</section>';

// ── Memory ──
html += '<section class="full">';
html += '<h2>Strategy Memory</h2>';
html += '<div class="memory-pane">' + (S.memory || 'No memory yet').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
html += '</section>';

// ── Log ──
html += '</div>';  // close grid
html += '<div style="background:var(--surface);padding:12px 20px;border-top:1px solid var(--border)">';
html += '<h2 style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px">Monitor Log</h2>';
html += '<div class="log-pane">';
const lines = S.log_lines || [];
for (const l of lines) {
  let cls = 'line';
  const ll = l.toLowerCase();
  if (ll.includes('warn') || ll.includes('⚠')) cls += ' warn';
  else if (ll.includes('error') || ll.includes('❌')) cls += ' err';
  else if (ll.includes('buy') || ll.includes('bought')) cls += ' buy';
  else if (ll.includes('sell') || ll.includes('sold')) cls += ' sell';
  html += '<div class="' + cls + '">' + l.replace(/</g, '&lt;') + '</div>';
}
if (lines.length === 0) html += '<div class="line">No log output yet</div>';
html += '</div></div>';

// Footer
html += '<div class="footer">';
html += '<span>Generated: ' + S.generated_at + '</span>';
html += '<span>Auto-refresh: 60s</span>';
html += '</div>';

document.getElementById('app').innerHTML = html;
</script>
</body>
</html>
